name: Crawl public PCB links
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/crawl.yml'
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: write
concurrency:
  group: design-indexer-pcb
  cancel-in-progress: false
jobs:
  crawl:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Scan and validate
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python crawler.py --max-repos 10 --max-requests 35
      - name: Commit cursor and links
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/state.json data/pcb_links.jsonl data/github_links.txt
          if ! git diff --cached --quiet; then
            git commit -m 'Update PCB link index'
            git status --short
            git stash push --include-untracked --quiet
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main
              if git push origin HEAD:main; then break; fi
              if [ "$attempt" -eq 5 ]; then exit 1; fi
              sleep 2
            done
          fi
