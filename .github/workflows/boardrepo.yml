name: Resolve BoardRepo GitHub links
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/boardrepo.yml'
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'
permissions:
  contents: write
concurrency:
  group: design-indexer-boardrepo
  cancel-in-progress: false
jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve up to 200 source links
        run: python boardrepo.py --max-pages 200
      - name: Save BoardRepo progress
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/boardrepo_links.txt data/boardrepo_state.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update BoardRepo GitHub links'
            git status --short
            git stash push --include-untracked --quiet
            for attempt in 1 2 3 4 5; do
              git pull --rebase origin main
              if git push origin HEAD:main; then break; fi
              if [ "$attempt" -eq 5 ]; then exit 1; fi
              sleep 2
            done
          fi
